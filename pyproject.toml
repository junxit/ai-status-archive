[project]
name = "ai-status-archive"
version = "1.0.0"
description = "Git-native historical record of AI provider service status."
requires-python = ">=3.12,<3.13"
license = { text = "Proprietary" }
authors = [{ name = "Jade Naaman" }]
dependencies = [
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aistatus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[dependency-groups]
dev = ["pytest>=8.0"]
