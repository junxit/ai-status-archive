# Dependabot version updates: a weekly check of the Python dependencies (pyproject.toml and
# uv.lock) and of the GitHub Actions in the workflows. Python minor and patch bumps share one
# pull request, and each major bump gets its own, since a major is the change most likely to
# break something; action updates all share one. ci.yml runs on each of these pull requests,
# but nothing exercises poll.yml or keepalive.yml before a merge. Security updates are switched
# on in the repository settings.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      python-minor-and-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore"
    groups:
      github-actions:
        patterns:
          - "*"
