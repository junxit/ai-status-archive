# Provider registry for ai-status-archive.
#
# Adding a provider that runs on an already-supported platform is an edit to this
# file and nothing else. Adding a new platform means one new adapter module plus
# one line in src/aistatus/adapters/__init__.py.
#
# Fields
#   name            Short key; also the filename stem under providers/, raw/, history/.
#   display_name    Human-readable provider name.
#   platform        Adapter key: "statuspage" or "google_cloud".
#   url             Primary endpoint polled every cycle.
#   catalog_url     Optional secondary endpoint for resolving stable IDs to names.
#   api_components  Component IDs considered API-relevant. Affects only the commit
#                   subject line and scripts/at.py's headline verdict, never what
#                   gets archived.
#   product_ids     Stable upstream product IDs to track (google_cloud only).
#
# IDs in this file were captured from the live endpoints on 2026-09-15. Display
# names in comments are for human orientation only and may already be stale --
# that is precisely why they are comments and the IDs are the data.

providers:
  # ---------------------------------------------------------------------------
  # OpenAI -- Atlassian Statuspage (rebuilt generation, ULID identifiers).
  #
  # Caveats verified against the live endpoint:
  #   * /api/v2/scheduled-maintenances.json and /api/v2/incidents/unresolved.json
  #     both 404. summary.json has no scheduled_maintenances key at all.
  #   * Incidents carry no components[], started_at, resolved_at, or shortlink,
  #     so affected_components is always empty for OpenAI.
  #   * No ETag and no Last-Modified, so conditional requests are impossible.
  #   * There is no component named "API". The list below is our own judgment
  #     about which of the 25 surfaces are API-relevant; all 25 are archived.
  # ---------------------------------------------------------------------------
  - name: openai
    display_name: OpenAI
    platform: statuspage
    url: https://status.openai.com/api/v2/summary.json
    api_components:
      - "01KVR95C58GGWHV7RYBT32NP11"  # Ads API
      - "01JSG1XMJ9RVJJQ0E85NVSJ2AZ"  # Agent
      - "01JMXBRMFEKVBWKK82B44QFMCE"  # Audio
      - "01JMXBRMFE5ESNNV8JDHVCGSRD"  # Batch
      - "01KMP3KP5MGE23B80K1EK4S8PV"  # Codex API
      - "01JNKS9D9S72PMP1938PVFFQN4"  # Compliance API
      - "01JMXBRMFEV0AJ0VVS68N9CD6R"  # Embeddings
      - "01JMXBNJXG1YMQPPCPCQX3MPA2"  # File uploads
      - "01JMXBRMFESJCBGJR10PDD3WCQ"  # Files
      - "01JMXBRMFEMZK0HPK19RYET250"  # Fine-tuning
      - "01JMXBRMFE4MAP2BHSJNZ787WX"  # Images
      - "01JMXBRMFEVZ7E0X9GD9FWR9WX"  # Moderations
      - "01JMXBRMFEQW613TFE89F45035"  # Realtime
      - "01JMXBNJXGKKP51D4DEJ2HZJ8Q"  # Search

  # ---------------------------------------------------------------------------
  # Anthropic -- Atlassian Statuspage (classic generation).
  #
  # status.anthropic.com redirects to status.claude.com and the page is titled
  # "Claude". We poll the canonical host directly to skip the redirect hop.
  # This is the only one of the three that honors conditional requests: it sends
  # a real ETag and returns a genuine 304.
  # ---------------------------------------------------------------------------
  - name: anthropic
    display_name: Anthropic
    platform: statuspage
    url: https://status.claude.com/api/v2/summary.json
    api_components:
      - "k8w3r06qmzrp"  # Claude API (api.anthropic.com)
      - "0qbwn08sd68x"  # Claude Console (platform.claude.com)

  # ---------------------------------------------------------------------------
  # Google Cloud -- custom incident feed, not Statuspage.
  #
  # The feed is incident-oriented and platform-wide across all of GCP, so the
  # adapter derives per-product state from which incidents are open. The product
  # list below is the component set: it is an allowlist, not discovered from the
  # feed, so that components do not blink in and out of existence between polls.
  #
  # Filtering is on stable IDs, never display names. Google's own published
  # schema says id "is stable" while title "is unstable and could change without
  # warning" -- and they are mid-rebrand from "Vertex AI" to "Agent Platform"
  # right now. Comments below show "old -> new" where a rename is already in
  # flight, which is the live proof that name-based filtering would have broken.
  #
  # Note: products.json is fetched every cycle to resolve IDs to current names.
  # If that request fails, the whole provider is treated as failed rather than
  # falling back to bare IDs, which would churn every component name.
  # ---------------------------------------------------------------------------
  - name: google
    display_name: Google Cloud (Vertex AI / Agent Platform)
    platform: google_cloud
    url: https://status.cloud.google.com/incidents.json
    catalog_url: https://status.cloud.google.com/products.json
